name: realty-bot

on:
  schedule:
    # 10:00, 13:00, 16:00, 19:00, 22:00 по Белграду (UTC+2 летом)
    - cron: '0 8,11,14,17,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: realty-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Публикация объявлений
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Сохранить память публикаций
        run: |
          git config user.name "realty-bot"
          git config user.email "realty-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "обновление памяти публикаций"
          git pull --rebase origin main || true
          git push
