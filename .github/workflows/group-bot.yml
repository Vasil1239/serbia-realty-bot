name: group-bot

on:
  schedule:
    # 5 запусков в день: 10:00, 13:00, 16:00, 19:00, 21:00 по Белграду летом
    # (зимой — на час раньше: 09:00, 12:00, 15:00, 18:00, 20:00). Без дублей под смену времени.
    # Скрипт сам не публикует вне окна 09:00–22:00.
    - cron: '0 8,11,14,17,19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Запустить вне расписания (1 = да)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: read

concurrency:
  group: group-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Публикация объявлений в группу
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ vars.GROUP_CHAT_ID }}
          FORCE_RUN: ${{ github.event.inputs.force || '0' }}
        run: python group_bot.py

      - name: Контроль бесплатных минут GitHub Actions
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ vars.GROUP_CHAT_ID }}
        run: python quota_check.py

      - name: Сохранить память публикаций
        run: |
          git config user.name "group-bot"
          git config user.email "group-bot@users.noreply.github.com"
          git add group_posted.json
          git diff --cached --quiet || git commit -m "группа: обновление памяти публикаций"
          git pull --rebase origin main || true
          git push
